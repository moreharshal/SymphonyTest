<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Symphony Calculator - RAP-837</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 500px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #667eea;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 14px;
        }

        .calculator-form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .input-group label {
            color: #333;
            font-weight: 600;
            font-size: 14px;
        }

        .input-group input {
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        .input-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .operation-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .operation-group label {
            color: #333;
            font-weight: 600;
            font-size: 14px;
        }

        .operation-buttons {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .operation-btn {
            padding: 15px;
            border: 2px solid #e0e0e0;
            background: white;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            color: #333;
        }

        .operation-btn:hover {
            background: #f5f5f5;
            border-color: #667eea;
        }

        .operation-btn.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .calculate-btn {
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .calculate-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .calculate-btn:active {
            transform: translateY(0);
        }

        .result-container {
            margin-top: 20px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 8px;
            border-left: 4px solid #667eea;
            display: none;
        }

        .result-container.show {
            display: block;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .result-label {
            color: #666;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .result-value {
            font-size: 32px;
            font-weight: 700;
            color: #667eea;
            word-break: break-all;
        }

        .error {
            border-color: #dc3545 !important;
        }

        .error-message {
            color: #dc3545;
            font-size: 14px;
            margin-top: 5px;
        }

        .clear-btn {
            padding: 12px;
            background: #f8f9fa;
            color: #666;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .clear-btn:hover {
            background: #e9ecef;
            border-color: #999;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🧮 Symphony Calculator</h1>
            <p>RAP-837: Mathematical Operations with JavaScript</p>
        </div>

        <form class="calculator-form" id="calculatorForm" onsubmit="return false;">
            <div class="input-group">
                <label for="number1">First Number</label>
                <input 
                    type="number" 
                    id="number1" 
                    placeholder="Enter first number" 
                    step="any"
                    required
                >
            </div>

            <div class="input-group">
                <label for="number2">Second Number</label>
                <input 
                    type="number" 
                    id="number2" 
                    placeholder="Enter second number" 
                    step="any"
                    required
                >
            </div>

            <div class="operation-group">
                <label>Select Operation</label>
                <div class="operation-buttons">
                    <button type="button" class="operation-btn active" data-operation="add">
                        ➕ Add
                    </button>
                    <button type="button" class="operation-btn" data-operation="subtract">
                        ➖ Subtract
                    </button>
                    <button type="button" class="operation-btn" data-operation="multiply">
                        ✖️ Multiply
                    </button>
                    <button type="button" class="operation-btn" data-operation="divide">
                        ➗ Divide
                    </button>
                </div>
            </div>

            <button type="submit" class="calculate-btn" id="calculateBtn">
                Calculate Result
            </button>

            <button type="button" class="clear-btn" id="clearBtn">
                Clear All
            </button>
        </form>

        <div class="result-container" id="resultContainer">
            <div class="result-label">Result:</div>
            <div class="result-value" id="resultValue">0</div>
        </div>
    </div>

    <script src="calculator.js"></script>
</body>
</html>
